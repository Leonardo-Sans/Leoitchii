name: Leoitchii - prototipo GTX1050Ti Windows

on:
  push:
    branches: [prototipo-gtx1050ti, experimentos-1050ti-v02, experimentos-gtx1050ti-cache-v04, lote-gtx1050ti-v05-preparacao, lote-gtx1050ti-v06-preparacao]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isola compilações entre branches, sem cancelar a build validada de outra versão.
  group: leoitchii-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Integrar e compilar Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Obter scripts Leoitchii
        uses: actions/checkout@v4

      - name: Integrar Fritchii v4.1 + correção Lichii
        shell: bash
        run: bash scripts/integrar-fritchii.sh source

      - name: Integrar correção de sincronismo dos filmes Eglantine
        if: contains(fromJSON('["experimentos-1050ti-v02","experimentos-gtx1050ti-cache-v04","lote-gtx1050ti-v05-preparacao","lote-gtx1050ti-v06-preparacao","lote-v07-menu-identidade"]'), github.ref_name)
        shell: bash
        run: bash scripts/integrar-video-eglantine.sh source

      - name: Gerar identidade do Leoitchii v0.7 (apenas build manual)
        if: github.ref_name == 'lote-v07-menu-identidade'
        shell: bash
        run: |
          python scripts/gerar-icone-leoitchii-v07.py source/dist/leoitchii.ico
          python scripts/aplicar-identidade-laboratorio-v07.py source

      - name: Preparar ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Instalar Vulkan SDK (script da base Fritchii)
        shell: pwsh
        working-directory: source
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verificar ferramentas
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          glslangValidator --version

      - name: Configurar Release
        shell: bash
        run: |
          tag=leoitchii-gtx1050ti-v0.6
          if [[ "${GITHUB_REF_NAME}" == "lote-v07-menu-identidade" ]]; then
            tag=leoitchii-gtx1050ti-v0.7
          fi
          cmake -S source -B source/build/leoitchii -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DLICHII_BUILD_TAG=${tag} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64

      - name: Compilar executáveis
        shell: bash
        run: cmake --build source/build/leoitchii --target yuzu yuzu-cmd --parallel 4

      - name: Verificar executáveis e adicionar Qt
        shell: pwsh
        run: |
          $bin = "source/build/leoitchii/bin"
          $exe = if ($env:GITHUB_REF_NAME -eq "lote-v07-menu-identidade") { "Leoitchii.exe" } else { "lichii.exe" }
          if (!(Test-Path "$bin/$exe")) { throw "$exe não foi gerado" }
          if (!(Test-Path "$bin/eden-cli.exe")) { throw "eden-cli.exe não foi gerado" }
          windeployqt --release --no-translations "$bin/$exe"

      - name: Criar pacote experimental
        shell: pwsh
        run: |
          $bin = "source/build/leoitchii/bin"
          if ('${{ github.ref_name }}' -eq 'experimentos-1050ti-v02') {
            Copy-Item "presets/Leoitchii-1050Ti-Eco.cmd" "$bin/Leoitchii-1050Ti-Eco.cmd"
            Copy-Item "presets/LEIA-PRIMEIRO-v02.txt" "$bin/LEIA-PRIMEIRO-v02.txt"
          }
          if ('${{ github.ref_name }}' -eq 'experimentos-gtx1050ti-cache-v04') {
            Copy-Item "presets/Leoitchii-v04-MeshCache-OFF.cmd" "$bin/Leoitchii-v04-MeshCache-OFF.cmd"
            Copy-Item "presets/Leoitchii-v04-ShaderWait-TESTE.cmd" "$bin/Leoitchii-v04-ShaderWait-TESTE.cmd"
            Copy-Item "presets/Leoitchii-v04-Monitor-VRAM.cmd" "$bin/Leoitchii-v04-Monitor-VRAM.cmd"
            Copy-Item "presets/LEIA-PRIMEIRO-v04.txt" "$bin/LEIA-PRIMEIRO-v04.txt"
          }
          if ('${{ github.ref_name }}' -eq 'lote-gtx1050ti-v05-preparacao') {
            Copy-Item "presets/LEOITCHII-GTX1050Ti-Laboratorio.cmd" "$bin/LEOITCHII-GTX1050Ti-Laboratorio.cmd"
            Copy-Item "presets/LEIA-PRIMEIRO-v05.txt" "$bin/LEIA-PRIMEIRO-v05.txt"
          }
          if ('${{ github.ref_name }}' -eq 'lote-gtx1050ti-v06-preparacao') {
            Copy-Item "presets/LEOITCHII-GTX1050Ti-Laboratorio-v06.cmd" "$bin/LEOITCHII-GTX1050Ti-Laboratorio-v06.cmd"
            Copy-Item "presets/Leoitchii-v06-Alias-OFF-A-B.cmd" "$bin/Leoitchii-v06-Alias-OFF-A-B.cmd"
            Copy-Item "presets/Leoitchii-v06-IR-Memoria-OFF-A-B.cmd" "$bin/Leoitchii-v06-IR-Memoria-OFF-A-B.cmd"
            Copy-Item "presets/LEOITCHII-V05-Bloom-TESTE.cmd" "$bin/LEOITCHII-Bloom-TESTE.cmd"
            Copy-Item "presets/LEIA-PRIMEIRO-v06.txt" "$bin/LEIA-PRIMEIRO-v06.txt"
          }
          if ('${{ github.ref_name }}' -eq 'lote-v07-menu-identidade') {
            Copy-Item 'docs/LEIA-PRIMEIRO-V07-MENU.md' "$bin/LEIA-PRIMEIRO-V07-MENU.md"
          }
          Compress-Archive -Path "$bin/*" -DestinationPath "Leoitchii-gtx1050ti-windows-experimental.zip" -Force

      - name: Disponibilizar artefato (somente se compilação passar)
        uses: actions/upload-artifact@v4
        with:
          name: Leoitchii-${{ github.ref_name }}-windows-experimental
          path: Leoitchii-gtx1050ti-windows-experimental.zip
          retention-days: 30
          if-no-files-found: error
