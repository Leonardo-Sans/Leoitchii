name: Leoitchii v0.6 - validar patches sem compilar
on:
  push:
    branches: [lote-gtx1050ti-v06-preparacao, lote-v07-menu-identidade, lote-v07-consolidada-fritchii55, lote-v07-lichii130-ports, lote-v07-pos-teste-video-pokopia, lote-v07-resgate-v06-astc-alias]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leoitchii-v06-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-patches:
    name: Integrar fontes / sintaxe (sem Windows build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe dos patches
        run: |
          python3 -m py_compile scripts/portar-av1-pascal-v06.py scripts/portar-oom-texturas-v06.py scripts/otimizar-alias-astc-v06.py scripts/liberar-ir-compute-v06.py scripts/gerar-icone-leoitchii-v07.py scripts/aplicar-identidade-laboratorio-v07.py scripts/portar-eglantine-video-v07.py scripts/portar-lichii130-correcoes-v07.py scripts/alternar-trim-zero-v07.py scripts/corrigir-shadow-engines-v07.py scripts/corrigir-shadow-qmd-vulkan-v07.py scripts/portar-legacy-alias-astc-v07.py scripts/portar-lichii807-memoria-v07.py
          bash -n scripts/integrar-fritchii.sh scripts/integrar-video-eglantine.sh scripts/portar-lichii130-trim-v07.sh
      - name: Integrar Fritchii e fallback Lichii
        if: ${{ !contains(fromJSON('["lote-v07-consolidada-fritchii55","lote-v07-lichii130-ports","lote-v07-pos-teste-video-pokopia","lote-v07-resgate-v06-astc-alias"]'), github.ref_name) }}
        run: bash scripts/integrar-fritchii.sh source
      - name: Integrar vídeo Eglantine
        if: ${{ !contains(fromJSON('["lote-v07-consolidada-fritchii55","lote-v07-lichii130-ports","lote-v07-pos-teste-video-pokopia","lote-v07-resgate-v06-astc-alias"]'), github.ref_name) }}
        run: bash scripts/integrar-video-eglantine.sh source
      - name: Validar trechos principais dos ports
        if: ${{ !contains(fromJSON('["lote-v07-consolidada-fritchii55","lote-v07-lichii130-ports","lote-v07-pos-teste-video-pokopia","lote-v07-resgate-v06-astc-alias"]'), github.ref_name) }}
        run: |
          grep -q 'avcodec_find_decoder_by_name("libdav1d")' source/src/video_core/host1x/ffmpeg.cpp
          grep -q 'bool may_fail' source/src/video_core/vulkan_common/vulkan_memory_allocator.cpp
          grep -q 'False(overlap.flags & ImageFlagBits::Remapped)' source/src/video_core/texture_cache/texture_cache.h
          grep -q 'm_clock_offset.reset' source/src/core/hle/service/nx2_gsv.h
          grep -q 'mesh_emulation.emplace' source/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -q 'LeoitchiiAliasFastEnabled' source/src/video_core/texture_cache/texture_cache.h
          grep -q 'GpuGuestMemory<u8, Tegra::Memory::GuestMemoryFlags::UnsafeRead>' source/src/video_core/texture_cache/texture_cache.h
          grep -q 'void Free()' source/src/shader_recompiler/object_pool.h
          grep -q 'LEOITCHII_IR_EARLY_FREE' source/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -q 'SetupPartition' source/src/video_core/host_shaders/astc_decoder.comp
          git -C source diff --check

      - name: Validar painel e branding v0.7 sem compilar
        if: github.ref_name == 'lote-v07-menu-identidade'
        run: |
          python scripts/gerar-icone-leoitchii-v07.py source/dist/leoitchii.ico
          python scripts/aplicar-identidade-laboratorio-v07.py source
          test -s source/dist/leoitchii.ico
          grep -q 'Leoitchii::InstallMenu(this)' source/src/yuzu/main_window.cpp
          grep -q 'Leoitchii::ApplyAtStartup()' source/src/yuzu/main.cpp
          grep -q 'OUTPUT_NAME "Leoitchii"' source/src/yuzu/CMakeLists.txt
          grep -q 'FileDescription' source/src/yuzu/yuzu.rc
          grep -q 'LEOITCHII_MESH_DISK_CACHE' source/src/yuzu/leoitchii_lab.h
          git -C source diff --check

      - name: Integrar Fritchii v5.5 e patches Leoitchii v0.7
        if: contains(fromJSON('["lote-v07-consolidada-fritchii55","lote-v07-lichii130-ports","lote-v07-pos-teste-video-pokopia","lote-v07-resgate-v06-astc-alias"]'), github.ref_name)
        run: bash scripts/integrar-fritchii-v55.sh source
      - name: Validar codigo e personalizacao da v0.7 Fritchii v5.5
        if: contains(fromJSON('["lote-v07-consolidada-fritchii55","lote-v07-lichii130-ports","lote-v07-pos-teste-video-pokopia","lote-v07-resgate-v06-astc-alias"]'), github.ref_name)
        run: |
          grep -q 'Leoitchii::InstallMenu(this)' source/src/yuzu/main_window.cpp
          grep -q 'Leoitchii::ApplyAtStartup()' source/src/yuzu/main.cpp
          grep -q 'OUTPUT_NAME "Leoitchii"' source/src/yuzu/CMakeLists.txt
          grep -q 'FileDescription' source/src/yuzu/yuzu.rc
          grep -q 'mesh_emulation.emplace' source/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -q 'LEOITCHII_VIDEO_VBLANK_FIX' source/src/core/hle/service/nx2_gsv.h
          grep -q 'avcodec_find_decoder_by_name("libdav1d")' source/src/video_core/host1x/ffmpeg.cpp
          test -s source/dist/leoitchii.ico
          if [[ "${GITHUB_REF_NAME}" == "lote-v07-lichii130-ports" || "${GITHUB_REF_NAME}" == "lote-v07-pos-teste-video-pokopia" || "${GITHUB_REF_NAME}" == "lote-v07-resgate-v06-astc-alias" ]]; then
            grep -q 'next_generation_base.fetch_add' source/src/core/device_memory_manager.h
            grep -q 'new_end = (start + size - 1)' source/src/common/multi_level_page_table.inc
            grep -q 'TrimZeroPages() const' source/src/common/host_memory.cpp
            grep -q 'LEOITCHII_ZERO_TRIM' source/src/core/device_memory.cpp
            grep -q 'LEOITCHII_ZERO_TRIM' source/src/yuzu/leoitchii_lab.h
            grep -q 'auto\* const bypass_state = rasterizer->OotNetworkBypass();' source/src/video_core/engines/kepler_compute.cpp
            grep -q 'auto\& draw_batch_state = draw_manager.draw_state;' source/src/video_core/engines/maxwell_3d.cpp
            grep -q 'for (const u64 dispatch_count : dispatch_checks)' source/src/video_core/engines/maxwell_3d.cpp
            grep -q 'for (const u64 dispatch_count : dispatches.unbounded)' source/src/video_core/engines/maxwell_3d.cpp
            grep -q 'u32 matched_audits = 0;' source/src/video_core/nx2_qmd_prediction.cpp
            grep -q 'split.RecordDispatchWrite(\*indirect_device, 12);' source/src/video_core/renderer_vulkan/vk_rasterizer.cpp
          fi
          if [[ "${GITHUB_REF_NAME}" == "lote-v07-pos-teste-video-pokopia" || "${GITHUB_REF_NAME}" == "lote-v07-resgate-v06-astc-alias" ]]; then
            grep -q 'Settings::values.oot_30fps.GetValue() && !recent_video' source/src/core/hle/service/nx2_gsv.h
            grep -q 'swap_interval = 1;' source/src/core/hle/service/nx2_gsv.h
            grep -q 'LEOITCHII_VIDEO_VBLANK_FIX' source/src/yuzu/leoitchii_lab.h
          fi
          if [[ "${GITHUB_REF_NAME}" == "lote-v07-resgate-v06-astc-alias" ]]; then
            grep -q 'newest_alias_tick' source/src/video_core/texture_cache/image_base.h
            grep -q 'LeoitchiiAliasFastEnabled' source/src/video_core/texture_cache/texture_cache.h
            grep -q 'LeoitchiiAstcDirectScanEnabled' source/src/video_core/texture_cache/texture_cache.h
            grep -q 'GpuGuestMemory<u8, Tegra::Memory::GuestMemoryFlags::UnsafeRead>' source/src/video_core/texture_cache/texture_cache.h
            grep -q 'LEOITCHII_ASTC_DIRECT_SCAN' source/src/yuzu/leoitchii_lab.h
            grep -q 'LEOITCHII_ALIAS_FAST' source/src/yuzu/leoitchii_lab.h
            grep -q 'ReportLeoitchiiHostMemoryFailure(exception.GetResult())' source/src/video_core/renderer_vulkan/vk_compute_pipeline.cpp
            grep -q 'ReportLeoitchiiHostMemoryFailure(exception.GetResult())' source/src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp
            test -s source/src/video_core/renderer_vulkan/leoitchii_host_memory_failure.h
          fi
          git -C source diff --check

      - name: Auditar compatibilidade dos demais ports Lichii 130 (sem aplicar)
        if: github.ref_name == 'lote-v07-lichii130-ports'
        run: bash scripts/auditar-compatibilidade-lichii130-v07.sh source
